<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소크라테스 수학 선생님 - 도형의 넓이</title>
<style>
:root{--p:#2563eb;--pl:#eff6ff;--bg:#f8fafc;--fg:#111827;--bd:#d1d5db;--ok:#16a34a;--warn:#d97706;--r:10px;}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid var(--bd);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .sub{font-size:13px;color:#6b7280}
.score{font-size:14px;color:#374151}
.score b{color:var(--p)}
.wrap{flex:1;display:flex;min-height:0}
aside{width:250px;background:#fff;border-right:1px solid var(--bd);padding:14px;overflow-y:auto;flex-shrink:0}
aside h2{font-size:13px;color:#6b7280;margin:14px 0 8px;font-weight:600}
aside h2:first-child{margin-top:0}
.topic{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:9px 10px;margin-bottom:6px;cursor:pointer;font-size:14px;font-family:inherit;color:var(--fg)}
.topic:hover{border-color:var(--p)}
.topic.active{border-color:var(--p);background:var(--pl);font-weight:600}
.topic .st{font-size:12px;color:#9ca3af}
.topic .st.done{color:var(--ok);font-weight:600}
.note{font-size:13px;line-height:1.6;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-height:60px;background:#fffbeb}
.note div{border-bottom:1px dashed #e5e7eb;padding:3px 0}
.note div:last-child{border-bottom:none}
.note .empty{color:#9ca3af}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(620px,85%);padding:11px 14px;border-radius:14px;line-height:1.6;font-size:15px;white-space:pre-wrap;word-break:keep-all}
.bot{align-self:flex-start;background:#fff;border:1px solid var(--bd);border-top-left-radius:4px}
.user{align-self:flex-end;background:var(--p);color:#fff;border-top-right-radius:4px}
.bot .who{font-size:12px;color:var(--p);font-weight:700;margin-bottom:3px}
.bot.hint{background:#fff7ed;border-color:#fed7aa}
.bot.hint .who{color:var(--warn)}
.bot.good{background:#f0fdf4;border-color:#bbf7d0}
.bot.good .who{color:var(--ok)}
.bot svg{display:block;width:100%;max-width:340px;margin-top:8px;background:#fafafa;border:1px solid #e5e7eb;border-radius:8px}
.choices{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start}
.choices button{border:1px solid var(--p);background:#fff;color:var(--p);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.choices button:hover{background:var(--pl)}
.typing{align-self:flex-start;color:#9ca3af;font-size:13px;padding-left:6px}
.bar{border-top:1px solid var(--bd);background:#fff;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap}
.bar input{flex:1;min-width:180px;border:1px solid var(--bd);border-radius:8px;padding:11px 12px;font-size:15px;font-family:inherit}
.bar input:focus{outline:2px solid var(--p);border-color:transparent}
.bar button{border:none;border-radius:8px;padding:0 16px;font-size:14px;cursor:pointer;font-family:inherit}
#send{background:var(--p);color:#fff}
.ghost{background:#f3f4f6;color:#374151}
.progress{height:4px;background:#e5e7eb}
.progress div{height:100%;background:var(--p);width:0;transition:width .3s}
@media(max-width:760px){aside{display:none}aside.open{display:block;position:fixed;top:60px;left:0;bottom:0;z-index:5}#menu{display:inline-block!important}}
#menu{display:none;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div>
    <h1>소크라테스 수학 선생님 · 도형의 넓이</h1>
    <div class="sub">정답을 알려주기보다 질문으로 스스로 찾도록 도와줘요 (초등 5~6학년)</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <span class="score">혼자 맞힘 <b id="sc1">0</b> · 힌트 받고 맞힘 <b id="sc2">0</b></span>
    <button id="menu" onclick="document.querySelector('aside').classList.toggle('open')">단원</button>
  </div>
</header>
<div class="progress"><div id="pg"></div></div>
<div class="wrap">
  <aside>
    <h2>탐구할 도형</h2>
    <div id="topics"></div>
    <h2>나의 발견 노트</h2>
    <div class="note" id="note"><span class="empty">스스로 발견한 공식이 여기에 쌓여요.</span></div>
    <h2>이렇게 말해도 돼요</h2>
    <div style="font-size:13px;color:#4b5563;line-height:1.7">"모르겠어요" · "힌트" → 실마리 질문<br>"처음부터" → 이 단원 다시 하기</div>
  </aside>
  <main>
    <div id="chat"></div>
    <div class="bar">
      <input id="inp" placeholder="생각한 답이나 이유를 적어 보세요" autocomplete="off">
      <button class="ghost" onclick="userSay('모르겠어요')">모르겠어요</button>
      <button id="send">보내기</button>
    </div>
  </main>
</div>

  }
  var t = document.createElement('div');
  t.textContent = text;
  d.appendChild(t);
  if (svgKey && S[svgKey]) {
    var sv = document.createElement('div');
    sv.innerHTML = S[svgKey];
    d.appendChild(sv);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function bot(text, cls, svgKey, cb){
  st.lock = true;
  var ty = document.createElement('div');
  ty.className = 'typing';
  ty.textContent = '선생님이 생각하는 중...';
  chat.appendChild(ty);
  chat.scrollTop = chat.scrollHeight;
  setTimeout(function(){
    ty.remove();
    addMsg(text, 'bot ' + (cls || ''), svgKey);
    st.lock = false;
    if (cb) cb();
  }, 450);
}
function clearChoices(){
  var c = document.querySelectorAll('.choices');
  for (var i = 0; i < c.length; i++) c[i].remove();
}
function showChoices(list){
  clearChoices();
  var box = document.createElement('div');
  box.className = 'choices';
  list.forEach(function(c){
    var b = document.createElement('button');
    b.textContent = c;
    b.onclick = function(){ userSay(c); };
    box.appendChild(b);
  });
  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
}

function renderTopics(){
  var el = document.getElementById('topics');
  el.innerHTML = '';
  TOPICS.forEach(function(t){
    var b = document.createElement('button');
    b.className = 'topic' + (st.t === t ? ' active' : '');
    var stt = st.done[t.id] ? '<span class="st done">완료</span>' : (st.t === t ? '<span class="st">' + (st.s + 1) + '/' + t.steps.length + '</span>' : '<span class="st">' + t.steps.length + '문항</span>');
    b.innerHTML = '<span>' + t.name + '</span>' + stt;
    b.onclick = function(){ startTopic(t); document.querySelector('aside').classList.remove('open'); };
    el.appendChild(b);
  });
  var total = 0, cur = 0;
  TOPICS.forEach(function(t){
    total += t.steps.length;
    if (st.done[t.id]) cur += t.steps.length;
    else if (st.t === t) cur += st.s;
  });
  document.getElementById('pg').style.width = (cur / total * 100) + '%';
  document.getElementById('sc1').textContent = st.solo;
  document.getElementById('sc2').textContent = st.helped;
}
function renderNote(){
  var n = document.getElementById('note');
  var items = TOPICS.filter(function(t){ return st.done[t.id]; });
  if (!items.length) {
    n.innerHTML = '<span class="empty">스스로 발견한 공식이 여기에 쌓여요.</span>';
    return;
  }
  n.innerHTML = '';
  items.forEach(function(t){
    var d = document.createElement('div');
    d.textContent = t.formula;
    n.appendChild(d);
  });
}

function startTopic(t){
  clearChoices();
  st.t = t; st.s = 0; st.tries = 0;
  renderTopics();
  addMsg('[' + t.name + '] 탐구 시작', 'user');
  bot(t.intro, '', null, ask);
}
function ask(){
  var step = st.t.steps[st.s];
  st.tries = 0;
  renderTopics();
  var head = '[' + (st.s + 1) + '/' + st.t.steps.length + ' · ' + (step.stage || '') + ']\n';
  bot(head + step.q, '', step.svg, function(){
    if (step.type === 'choice') showChoices(step.choices);
    inp.focus();
  });
}

// ---------- 답 판단 ----------
function norm(s){ return s.replace(/\s+/g, '').toLowerCase(); }
function isHalf(s){
  var x = s.replace(/반지름/g, '');
  return /절반|반|2분의1|이분의일|1\/2|½|나누기2|÷2|\/2|0\.5|둘로나|2로나/.test(x);
}
function hasTok(s, tok){ return tok === 'HALF' ? isHalf(s) : s.indexOf(tok) >= 0; }
function check(step, raw){
  var s = norm(raw);
  if (step.type === 'num') {
    var m = s.replace(/,/g, '').match(/-?\d+(\.\d+)?/);
    return m ? Math.abs(parseFloat(m[0]) - step.ans) < 0.001 : false;
  }
  if (step.type === 'choice') return norm(step.ans) === s || s.indexOf(norm(step.ans)) >= 0;
  if (step.type === 'kw') {
    return step.kw.some(function(group){
      return group.every(function(tok){ return hasTok(s, tok); });
    });
  }
  return s.length > 0;
}

function next(){
  st.s++;
  if (st.s >= st.t.steps.length) {
    st.done[st.t.id] = true;
    renderTopics();
    renderNote();
    var remain = TOPICS.filter(function(t){ return !st.done[t.id]; });
    var msg = '[' + st.t.name + '] 탐구 완료!\n\n오늘 스스로 발견한 공식:\n' + st.t.formula + '\n\n공식을 외우는 것보다 "왜 그렇게 되는지"를 설명할 수 있는 것이 더 중요해요. 여러분은 이제 설명할 수 있어요.';
    if (remain.length) msg += '\n\n다음엔 어떤 도형을 탐구해 볼까요?';
    else msg += '\n\n모든 도형을 탐구했어요! 모든 공식이 결국 "직사각형으로 바꾸기"에서 나왔다는 것, 눈치챘나요?';
    bot(msg, 'good', null, function(){
      if (remain.length) showChoices(remain.map(function(t){ return t.name; }));
    });
    st.t = null;
    return;
  }
  ask();
}

function userSay(text){
  text = (text || '').trim();
  if (!text || st.lock) return;
  clearChoices();
  addMsg(text, 'user');
  inp.value = '';

  if (!st.t) {
    var tp = TOPICS.find(function(t){ return norm(t.name).indexOf(norm(text)) >= 0 || norm(text).indexOf(norm(t.name).replace(/\(.*\)/, '')) >= 0; });
    if (tp) { st.t = tp; st.s = 0; renderTopics(); bot(tp.intro, '', null, ask); }
    else bot('어떤 도형을 탐구해 볼까요? 왼쪽 목록이나 아래 버튼에서 골라 주세요.', '', null, function(){ showChoices(TOPICS.map(function(t){ return t.name; })); });
    return;
  }
  if (/처음부터|다시시작/.test(norm(text))) { var t0 = st.t; st.t = null; startTopic(t0); return; }

  var step = st.t.steps[st.s];
  var askHelp = /모르|몰라|힌트|글쎄|잘모|어려워|헷갈/.test(norm(text));

  if (!askHelp && check(step, text)) {
    if (step.type === 'open') { bot(step.ok, 'good', null, next); return; }
    if (st.tries === 0) st.solo++; else st.helped++;
    bot(pick(PRAISE) + ' ' + step.ok, 'good', null, next);
    return;
  }
  if (step.type === 'open') { bot('어떤 생각이든 좋아요. 짧게라도 내 생각을 적어 볼래요?', 'hint'); return; }

  st.tries++;
  var h = step.hints || [];
  if (st.tries <= h.length) {
    var pre = askHelp ? '괜찮아요, 모르는 건 부끄러운 게 아니에요. 이렇게 생각해 볼까요?' : pick(RETRY);
    bot(pre + '\n\n' + h[st.tries - 1], 'hint', null, function(){ if (step.type === 'choice') showChoices(step.choices); });
  } else {
    bot('함께 정리해 볼게요. 답은 "' + step.ans + '"이에요.\n' + step.ok + '\n\n왜 그런지 이해되었다면 다음으로 넘어가 볼게요.', '', null, next);
  }
}

document.getElementById('send').onclick = function(){ userSay(inp.value); };
inp.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.isComposing) userSay(inp.value); });

renderTopics();
bot('안녕하세요! 저는 소크라테스 수학 선생님이에요.\n\n소크라테스는 답을 가르쳐 주는 대신 질문을 던져서 사람들이 스스로 깨닫게 했대요. 저도 질문을 할 테니, 여러분이 직접 도형의 넓이 공식을 "발견"해 보세요.\n\n어떤 도형부터 탐구해 볼까요? (처음이라면 평행사변형부터 추천해요)', '', null, function(){
  showChoices(TOPICS.map(function(t){ return t.name; }));
});
</script>
